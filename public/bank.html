<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>LateralAI · Question bank</title>
  <link rel="icon" type="image/png" sizes="64x64" href="/favicon.png">
  <link rel="icon" href="/favicon.ico" sizes="any">
  <link rel="apple-touch-icon" href="/img/logo-180.png">
  <link rel="stylesheet" href="/css/style.css">
  <script>try{var t=localStorage.getItem('lg_theme');if(t==='light'||t==='dark')document.documentElement.dataset.theme=t}catch(e){}</script>
</head>
<body>
  <header class="site-header">
    <div class="container">
      <div class="brand"><img class="logo" src="/img/logo-128.png" alt="" width="40" height="40"><h1>LateralAI</h1><span class="tagline">Question bank</span></div>
      <nav class="site-nav"><a href="/">Play</a><a href="/bank" class="active">Question bank</a><a href="/generate">Generate</a><a href="/leaderboard">Leaderboard</a></nav>
      <div class="game-details"><span id="header-stats">Loading…</span><span class="profile-control" id="profile-bar"></span><span class="theme-control" id="theme-bar" role="group" aria-label="Colour theme"></span></div>
    </div>
  </header>

  <main class="container">
    <div class="toolbar">
      <input type="search" id="search" placeholder="Search title or situation…" aria-label="Search">
      <select class="btn" id="filter-status" aria-label="Filter by status">
        <option value="">All statuses</option>
        <option value="new">New</option>
        <option value="tried">Tried</option>
        <option value="solved">Solved</option>
        <option value="revealed">Revealed</option>
      </select>
      <select class="btn" id="filter-added" aria-label="Filter by date added">
        <option value="">Added any time</option>
        <option value="1">Added today</option>
        <option value="7">Added this week</option>
        <option value="30">Added this month</option>
      </select>
      <select class="btn" id="filter-rating" aria-label="Filter by your rating">
        <option value="">Any rating</option>
        <option value="up">Liked</option>
        <option value="down">Disliked</option>
        <option value="none">Not rated</option>
      </select>
      <select class="btn" id="filter-model" aria-label="Filter by the model that wrote the puzzle">
        <option value="">Any model</option>
      </select>
      <select class="btn" id="filter-difficulty" aria-label="Filter by difficulty">
        <option value="">All difficulties</option>
        <option value="easy">Easy</option>
        <option value="medium">Medium</option>
        <option value="hard">Hard</option>
      </select>
      <span class="count" id="count"></span>
      <a class="btn with-icon" id="export-progress" href="/api/progress/export" download title="Download your progress as a JSON file">Export</a>
      <button class="btn with-icon" id="import-progress" type="button" title="Replace your progress from a JSON file">Import</button>
      <input type="file" id="import-file" accept="application/json,.json" hidden>
      <button class="btn danger" id="reset-all">Reset all progress</button>
    </div>

    <section class="card table-wrap">
      <table class="bank-table">
        <thead>
          <tr>
            <th><button type="button" class="sort" data-sort="title">Puzzle</button></th>
            <th><button type="button" class="sort" data-sort="difficulty">Difficulty</button></th>
            <th><button type="button" class="sort" data-sort="model">Model</button></th>
            <th><button type="button" class="sort" data-sort="status">Status</button></th>
            <th><button type="button" class="sort" data-sort="score">Score</button></th>
            <th><button type="button" class="sort" data-sort="hints">Hints</button></th>
            <th><button type="button" class="sort" data-sort="played">Last played</button></th>
            <th><button type="button" class="sort" data-sort="added">Date added</button></th>
            <th class="right">Actions</th>
          </tr>
        </thead>
        <tbody id="rows"><tr><td colspan="9" class="empty">Loading…</td></tr></tbody>
      </table>
    </section>
  </main>
  <script type="module" src="/js/bank.js"></script>
</body>
</html>
